name: Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package extension into ZIP
        run: |
          mkdir -p dist
          zip -r dist/sportlink-waterpolo-assistant.zip \
            manifest.json \
            interceptor.js \
            background.js \
            content.js \
            content.css \
            README.md \
            icons \
            popup

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          gh release create "$TAG" dist/sportlink-waterpolo-assistant.zip \
            --title "Release $TAG" \
            --generate-notes
